<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
   
    <div class="container">
        <h1>Password Generator</h1>
        <div class="display_container">
           <input readonly placeholder="Password" class="display" data-passwordDisplay>
           <button data-copy>
            <span data-copyMsg></span>
            <img src="https://www.svgrepo.com/show/522803/copy.svg" alt="copy" width="23",height="23">
           </button>
        </div>
       

        <div class="input_container"> 

        <div class="length-container">
            <label>Password Length</label>
            <span data-lengthNumber>10</span>
        </div>
         
        <input type ="range" min="1" max="20"  class="Slider" step="1" data-lengthSlider> 


        <div class="check">
            <input type="checkbox" id="uppercase">
            <label for="uppercase">include uppercase letter</label>
        </div>

        <div class="check">
            <input type="checkbox" id="lowercase">
            <label for="lowercase">include lowercase letter</label>
        </div>

        <div class="check">
            <input type="checkbox" id="numbers">
            <label for="numbers">include numbers</label>
        </div>
        <div class="check">
           <input type="checkbox" id="symbols">
            <label for="symbols">include symbols</label>
        </div>
        <div class="strength-container">
            <p>Strength</p>
            <div class="indicator" data-indicator></div>

        </div>
        <button class="generate-button">Generate Password</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
